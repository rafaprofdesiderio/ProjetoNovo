<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Cadastro de aluno</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="container container-form">
    <header class="cabecalho">
        <div>
            <h1 th:text="${titulo}">Cadastro de aluno</h1>
            <p>Informe os dados do aluno</p>
        </div>
        <a class="botao secundario" th:href="@{/alunos}">Voltar à lista</a>
    </header>

    <section class="cartao">
        <form th:action="${acao}" th:object="${aluno}" method="post" class="formulario">
            <div class="campo">
                <label for="rm">RM</label>
                <input id="rm" type="number" th:field="*{rm}" min="1" required
                       th:readonly="${titulo == 'Editar aluno'}">
                <small>O RM é o identificador do aluno.</small>
            </div>
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" type="text" th:field="*{nome}" maxlength="120" required>
            </div>
            <div class="campo">
                <label for="turma">Turma</label>
                <input id="turma" type="text" th:field="*{turma}" maxlength="30" required>
            </div>
            <div class="campo">
                <label for="nota">Nota</label>
                <input id="nota" type="number" th:field="*{nota}" min="0" max="10"
                       step="0.01" required>
            </div>
            <div class="botoes-form">
                <button class="botao primario" type="submit">Salvar</button>
                <a class="botao secundario" th:href="@{/alunos}">Cancelar</a>
            </div>
        </form>
    </section>
    <footer>Confira os dados antes de salvar.</footer>
</main>
</body>
</html>
